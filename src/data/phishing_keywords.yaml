# Phishing keywords used by rules_context.check_keywords.
# The FQDN is split into tokens on '.', '-' and '_', then each token is
# compared to the lists below (exact match, lowercase, no accents).
#   strong:    words typical of a phishing page (STRONG_KEYWORD_SCORE)
#   weak:      words also common on legitimate infrastructure (WEAK_KEYWORD_SCORE)
#   compounds: hyphenated token sequences, matched as contiguous tokens; the
#              glued form ('passwordreset') is also recognized (COMPOUND_KEYWORD_SCORE)
#   root_only: weak-weighted words ignored in subdomains, where they are mostly
#              noise (scanner labels, 'pay.' endpoints): only the registered root counts
# Infrastructure words (mail, admin, portal, support, api...) are deliberately absent.
version: 2
strong:
  fr:
  - connexion
  - connecter
  - identification
  - authentification
