# Regex whitelist: any FQDN matching one of these patterns is never scored.
# Case-insensitive, applied with re.search on the FQDN: anchor with ^ and $.
# Use single quotes so backslashes are kept as-is.
version: 1
patterns:
- '(^|\.)(admin-)?(rs-)?mcas(-df)?(\.ms|-gov\.us)$'
- '\.azuremonitor\.trafficmanager\.cn$'
- '^azuregateway-[0-9a-f-]+\.cloudapp\.net$'
- '(^|\.)azure-api\.(us|cn)$'
- '\.azure-api\.sovcloud-api\.fr$'
- '\.azure\.(intranet\.)?confluent(-untrusted)?\.cloud$'
- '\.azure\.(privatelink\.)?snowflake\.(app|com)$'
- '\.azure\.byoc\.clickhouse-dev\.com$'
- '\.microsoft-falcon\.net$'
- '\.bolt\.104-36-85-232\.sslip\.io$'
